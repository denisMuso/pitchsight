[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchsight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1", "mlflow>=3,<4", "matplotlib>=3.9,<4"]
data = ["SoccerNet==0.2.0", "pyzipper==0.4.0"]

[project.scripts]
pitchsight = "pitchsight.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pitchsight*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
